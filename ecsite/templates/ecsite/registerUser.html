{% load static %}
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>会員登録</title>
        <link rel='stylesheet' type='text/css' href='{% static "ecsite/css/style.css" %}' />
    </head>
    <body>
        <h3>会員情報を入力してください。</h3>
        <br />
        <form action="{% url 'ecsite:user_regist' %}" method="POST">
            {% csrf_token %}
            <table>
                {{regist_form}}
                <tr>
                    <td colspan="2"><input type="submit" value="登録確認"></td>
                </tr>
            </table>
            {% if messgae %}
                <div>{{message}}</div>
            {% endif %}
            <br>
            <a href="{% url 'ecsite:top' %}">商品検索</a>へ<br>
        </form>
    </body>
</html>
